<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Underwater hand-tracking slicing game" />
    <title>Underwater Hand Slice</title>
  </head>
  <body>
    <div id="app">
      <div id="gameShell" class="game-shell">
        <video id="cameraVideo" playsinline muted></video>
        <canvas id="backgroundCanvas" aria-hidden="true"></canvas>
        <canvas id="cameraCanvas" aria-hidden="true"></canvas>
        <canvas id="gameCanvas" aria-label="Underwater slicing game"></canvas>
        <canvas id="effectsCanvas" aria-hidden="true"></canvas>
        <div id="hud" class="hud" aria-live="polite"></div>
        <div id="overlay" class="overlay"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
